[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-budget-optimization"
version = "0.1.0"
description = "Portable harness for evaluating vLLM reasoning budget transition strings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rbo = "rbo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rbo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
